<style>
  :root {

  body {
    background: var(--bg-black) url('assets/background.png') no-repeat center top;
    background-size: cover;
    font-family: 'Arial Black', Impact, sans-serif;
    color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 20px 40px 60px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .grid img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
  }
</style>
