*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(rgba(5,3,9,.55),rgba(5,3,9,.85)),url("assets/teg-nebula-bg.jpg") center/cover no-repeat fixed;
    background-image:linear-gradient(rgba(5,3,9,.55),rgba(5,3,9,.85)),image-set(url("assets/teg-nebula-bg.webp") type("image/webp"),url("assets/teg-nebula-bg.jpg") type("image/jpeg"));
  background-color:var(--bg);color:var(--text);font-family:'Space Grotesk','Space Grotesk Fallback',sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}

  font-weight:700;letter-spacing:.12em;padding:14px 32px;border-radius:10px;font-size:13px;transition:all .2s}

<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <img class="logo" src="assets/apple-touch-icon.png" width="110" height="110" alt="Third Eye Goliath">
  <h1>YOU'RE IN.</h1>
  <p>Welcome to the tribe. You'll be first to hear about <strong>new drops</strong>, restocks, and members-only deals. The store is open now — go take a look.</p>
  <a class="back" href="https://shop.thirdeyegoliath.com">SHOP NOW</a>
</div>
<script>
const c = document.getElementById('stars'), x = c.getContext('2d');
let stars = [];
function sizeCanvas(){ c.width = innerWidth; c.height = innerHeight;
  stars = Array.from({length: 160}, () => ({x: Math.random()*c.width, y: Math.random()*c.height,
    r: Math.random()*1.6+.3, p: Math.random()*Math.PI*2, sp: .008+Math.random()*.02}));
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
(function draw(){
  x.clearRect(0,0,c.width,c.height);
  for(const s of stars){ s.p += s.sp; x.globalAlpha = .25 + Math.abs(Math.sin(s.p))*.6; x.fillStyle = '#e8dcff';
    x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); }
  x.globalAlpha = 1; requestAnimationFrame(draw);
})();
</script>
</body>
