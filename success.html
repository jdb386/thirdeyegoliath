<style>
:root{ --bg:#050309; --violet:#7b2ff7; --lav:#a855f7; --teal:#2dd4bf; --gold:#d4a94e; --text:#f5f0ff; --muted:#b8a8d8; }
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(rgba(5,3,9,.6),rgba(5,3,9,.85)),url("assets/teg-nebula-bg.png") center/cover no-repeat fixed;
  background-color:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;overflow-x:hidden}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.eye-logo{width:92px;height:92px;margin-bottom:24px;filter:drop-shadow(0 0 18px rgba(212,169,78,.55))}
h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:clamp(32px,6vw,52px);letter-spacing:.05em;margin-bottom:16px;
  background:linear-gradient(100deg,#fff 20%,var(--lav) 55%,var(--teal) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);font-size:17px;max-width:500px;line-height:1.6;margin-bottom:34px}
a.back{display:inline-block;background:var(--gold);color:#050309;text-decoration:none;font-family:'Unbounded',sans-serif;
  font-weight:700;letter-spacing:.12em;padding:14px 32px;border-radius:10px;font-size:13px;transition:all .2s}
a.back:hover{background:var(--violet);color:#fff;box-shadow:0 0 20px rgba(123,47,247,.5)}
</style>

<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <svg class="eye-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#d4a94e" stroke-width="3">
    <path d="M8 50 Q50 12 92 50 Q50 88 8 50 Z"/>
    <circle cx="50" cy="50" r="14" fill="#d4a94e" stroke="none"/>
    <circle cx="50" cy="50" r="6" fill="#050309" stroke="none"/>
    <line x1="50" y1="6" x2="50" y2="18"/><line x1="50" y1="82" x2="50" y2="94"/>
    <line x1="14" y1="22" x2="22" y2="30"/><line x1="78" y1="70" x2="86" y2="78"/>
    <line x1="86" y1="22" x2="78" y2="30"/><line x1="22" y1="70" x2="14" y2="78"/>
  </svg>
  <h1>YOU'RE IN.</h1>
  <p>Welcome to the tribe. You'll be the first to know when we launch — new designs, early access, and a few surprises along the way. Stay aligned. Stay tuned.</p>
  <a class="back" href="index.html">BACK TO HOME</a>
</div>
<script>
const c = document.getElementById('stars'), x = c.getContext('2d');
let stars = [];
function sizeCanvas(){ c.width = innerWidth; c.height = innerHeight;
  stars = Array.from({length: 160}, () => ({x: Math.random()*c.width, y: Math.random()*c.height,
    r: Math.random()*1.6+.3, p: Math.random()*Math.PI*2, sp: .008+Math.random()*.02}));
}
sizeCanvas(); addEventListener('resize', sizeCanvas);
(function draw(){
  x.clearRect(0,0,c.width,c.height);
  for(const s of stars){ s.p += s.sp; x.globalAlpha = .25 + Math.abs(Math.sin(s.p))*.6; x.fillStyle = '#e8dcff';
    x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); }
  x.globalAlpha = 1; requestAnimationFrame(draw);
})();
</script>
</body>
