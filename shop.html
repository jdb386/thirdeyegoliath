<style>
  :root { --neon-yellow:#f4e83a; --neon-green:#7ed321; --neon-pink:#ff2e88; --neon-orange:#f5941f; --bg-black:#060608; }

<div class="shop-msg">
  <h2>SHOP OPENS AT LAUNCH</h2>
  <p>Our store isn't live just yet — but the countdown is on. Check out the Collections page to preview designs in the meantime.</p>
</div>

<!-- COUNTDOWN -->
<section style="text-align:center; padding:50px 20px; position:relative; z-index:2;">
  <img class="section-divider" src="assets/divider.png" alt="" style="max-width:500px; width:100%; margin:0 auto 15px; display:block;">
  <h3 style="color:var(--neon-green); font-size:24px; letter-spacing:1px; margin-top:-10px; margin-bottom:25px;">LAUNCHING IN</h3>
  <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">
    <div style="border:2px solid var(--neon-yellow); border-radius:10px; padding:20px 25px; min-width:100px;">
      <div id="days" style="font-size:38px; color:var(--neon-yellow);">00</div>
      <div style="font-family:Arial, sans-serif; font-size:12px; letter-spacing:2px; color:#ccc;">DAYS</div>
    </div>
    <div style="border:2px solid var(--neon-green); border-radius:10px; padding:20px 25px; min-width:100px;">
      <div id="hours" style="font-size:38px; color:var(--neon-green);">00</div>
      <div style="font-family:Arial, sans-serif; font-size:12px; letter-spacing:2px; color:#ccc;">HOURS</div>
    </div>
    <div style="border:2px solid var(--neon-pink); border-radius:10px; padding:20px 25px; min-width:100px;">
      <div id="minutes" style="font-size:38px; color:var(--neon-pink);">00</div>
      <div style="font-family:Arial, sans-serif; font-size:12px; letter-spacing:2px; color:#ccc;">MINUTES</div>
    </div>
    <div style="border:2px solid var(--neon-orange); border-radius:10px; padding:20px 25px; min-width:100px;">
      <div id="seconds" style="font-size:38px; color:var(--neon-orange);">00</div>
      <div style="font-family:Arial, sans-serif; font-size:12px; letter-spacing:2px; color:#ccc;">SECONDS</div>
    </div>
  </div>
</section>

<script>
  const launchDate = new Date("October 1, 2026 00:00:00").getTime();
  const countdown = setInterval(function() {
    const now = new Date().getTime();
    const distance = launchDate - now;
    if (distance < 0) {
      clearInterval(countdown);
      ["days","hours","minutes","seconds"].forEach(id => document.getElementById(id).textContent = "00");
      return;
    }
    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
    document.getElementById("days").textContent = String(days).padStart(2, '0');
    document.getElementById("hours").textContent = String(hours).padStart(2, '0');
    document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
    document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
  }, 1000);
</script>

</body>
